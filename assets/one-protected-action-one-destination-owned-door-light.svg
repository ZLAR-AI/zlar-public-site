<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">One Protected Action. One Destination-Owned Door.</title>
  <desc id="desc">Four request sources converge on a destination-owned guard. Recognized authorization permits the exact protected action and produces an execution receipt. Missing or unrecognized authorization causes refusal and produces a refusal receipt.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#EEF6FA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow-blue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12z" fill="#1769E0"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12z" fill="#2EA30C"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L12 6L0 12z" fill="#F22B1D"/>
    </marker>
    <style>
      :root {
        --paper: #FFFFFF;
        --ink: #0B132B;
        --soft: #334155;
        --muted: #64748B;
        --line: #CBD5E1;
      }
      text {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        letter-spacing: 0;
      }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#background)"/>
  <circle cx="1100" cy="230" r="330" fill="#00A6B8" opacity="0.045"/>
  <circle cx="260" cy="790" r="260" fill="#8B3FD1" opacity="0.035"/>

  <text x="70" y="82" fill="#0B132B" font-size="51" font-weight="850" text-anchor="start"><tspan x="70" dy="0">One Protected Action. One Destination-Owned Door.</tspan></text>
  <text x="72" y="124" fill="#334155" font-size="27" font-weight="560" text-anchor="start"><tspan x="72" dy="0">Source alone never grants authority.</tspan></text>

  <text x="70" y="172" fill="#64748B" font-size="17" font-weight="850" text-anchor="start"><tspan x="70" dy="0">REQUEST SOURCES</tspan></text>
  <text x="735" y="220" fill="#00A6B8" font-size="17" font-weight="850" text-anchor="start"><tspan x="735" dy="0">DESTINATION CHECKPOINT</tspan></text>
  <text x="1375" y="220" fill="#64748B" font-size="17" font-weight="850" text-anchor="start"><tspan x="1375" dy="0">OUTCOMES</tspan></text>

  
    <g filter="url(#shadow)">
      <rect x="70" y="200" width="430" height="136" rx="20" fill="var(--paper)" stroke="#8B3FD1" stroke-width="2.5"/>
      <rect x="70" y="200" width="10" height="136" rx="5" fill="#8B3FD1"/>
    </g>
    
    <g transform="translate(105 229)" fill="none" stroke="#8B3FD1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="5" y="8" width="70" height="58" rx="16"/>
      <path d="M25 8V0M55 8V0M25 74v-8M55 74v-8M5 28H-3M5 48H-3M83 28h-8M83 48h-8"/>
      <circle cx="28" cy="36" r="5"/><circle cx="52" cy="36" r="5"/>
      <path d="M27 53h26"/>
    </g>
    <text x="215" y="251" fill="var(--ink)" font-size="25" font-weight="800" text-anchor="start"><tspan x="215" dy="0">AI AGENT</tspan></text>
    <text x="215" y="284" fill="var(--soft)" font-size="19" font-weight="500" text-anchor="start"><tspan x="215" dy="0">Inside its intended environment</tspan></text>
    <g filter="url(#shadow)">
      <rect x="70" y="368" width="430" height="136" rx="20" fill="var(--paper)" stroke="#F22B1D" stroke-width="2.5"/>
      <rect x="70" y="368" width="10" height="136" rx="5" fill="#F22B1D"/>
    </g>
    
    <g transform="translate(105 397)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 15V3h28M60 3h17v25M77 56v17H48M20 73H3V48" stroke="#CBD5E1" stroke-width="4" stroke-dasharray="8 7"/>
      <rect x="18" y="21" width="48" height="42" rx="11" stroke="#F22B1D" stroke-width="4"/>
      <circle cx="34" cy="41" r="4" fill="#F22B1D" stroke="none"/>
      <circle cx="50" cy="41" r="4" fill="#F22B1D" stroke="none"/>
      <path d="M34 53h17" stroke="#F22B1D" stroke-width="4"/>
      <path d="M55 9h31v31M85 10L55 40" stroke="#F22B1D" stroke-width="5"/>
    </g>
    <text x="215" y="419" fill="var(--ink)" font-size="25" font-weight="800" text-anchor="start"><tspan x="215" dy="0">AI AGENT</tspan></text>
    <text x="215" y="452" fill="var(--soft)" font-size="19" font-weight="500" text-anchor="start"><tspan x="215" dy="0">Outside intended containment</tspan></text>
    <g filter="url(#shadow)">
      <rect x="70" y="536" width="430" height="136" rx="20" fill="var(--paper)" stroke="#1769E0" stroke-width="2.5"/>
      <rect x="70" y="536" width="10" height="136" rx="5" fill="#1769E0"/>
    </g>
    
    <g transform="translate(105 565)" fill="none" stroke="#1769E0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="8" width="78" height="60" rx="9"/>
      <path d="M2 24h78"/>
      <circle cx="14" cy="16" r="2.5" fill="#1769E0" stroke="none"/>
      <circle cx="24" cy="16" r="2.5" fill="#1769E0" stroke="none"/>
      <path d="M19 39h42M19 52h27"/>
    </g>
    <text x="215" y="587" fill="var(--ink)" font-size="20" font-weight="800" text-anchor="start"><tspan x="215" dy="0">APPLICATION OR WORKFLOW</tspan></text>
    <text x="215" y="620" fill="var(--soft)" font-size="19" font-weight="500" text-anchor="start"><tspan x="215" dy="0">Legitimate access or identity</tspan></text>
    <g filter="url(#shadow)">
      <rect x="70" y="704" width="430" height="136" rx="20" fill="var(--paper)" stroke="#E5A000" stroke-width="2.5"/>
      <rect x="70" y="704" width="10" height="136" rx="5" fill="#E5A000"/>
    </g>
    
    <g transform="translate(105 733)" fill="none" stroke="#E5A000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="8" width="75" height="58" rx="9"/>
      <circle cx="22" cy="32" r="9"/>
      <path d="M10 55c3-9 21-9 24 0M44 25h21M44 38h15"/>
      <path d="M61 49l16 27M77 49L61 76" stroke-width="6"/>
    </g>
    <text x="215" y="755" fill="var(--ink)" font-size="20" font-weight="800" text-anchor="start"><tspan x="215" dy="0">COMPROMISED CREDENTIAL</tspan></text>
    <text x="215" y="788" fill="var(--soft)" font-size="19" font-weight="500" text-anchor="start"><tspan x="215" dy="0">A valid session is not authority</tspan></text>
  <path d="M500 268 H585 Q625 268 655 372 H735" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)" opacity="0.72"/><path d="M500 436 H585 Q625 436 655 468 H735" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)" opacity="0.72"/><path d="M500 604 H585 Q625 604 655 564 H735" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)" opacity="0.72"/><path d="M500 772 H585 Q625 772 655 660 H735" fill="none" stroke="#1769E0" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-blue)" opacity="0.72"/>

  <g filter="url(#shadow)">
    <rect x="735" y="250" width="500" height="580" rx="28" fill="#ECFBFD" stroke="#00A6B8" stroke-width="4"/>
  </g>
  
    <g transform="translate(920 292)" fill="none" stroke="#00A6B8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M65 2c23 17 44 18 60 19v44c0 38-22 67-60 84C27 132 5 103 5 65V21C21 20 42 19 65 2z"/>
      <rect x="42" y="61" width="46" height="41" rx="8"/>
      <path d="M52 61V49c0-18 26-18 26 0v12M65 77v10"/>
    </g>
  <text x="985" y="495" fill="#0B132B" font-size="30" font-weight="850" text-anchor="middle"><tspan x="985" dy="0">DESTINATION-OWNED GUARD</tspan></text>
  <text x="985" y="533" fill="#334155" font-size="22" font-weight="600" text-anchor="middle"><tspan x="985" dy="0">verifies before consequence</tspan></text>
  <rect x="810" y="575" width="350" height="52" rx="12" fill="#00A6B8" opacity="0.14" stroke="#00A6B8" stroke-width="2"/>
  <text x="985" y="609" fill="#00A6B8" font-size="19" font-weight="850" text-anchor="middle"><tspan x="985" dy="0">EXACT PROTECTED ACTION</tspan></text>
  <circle cx="832" cy="673" r="6" fill="#00A6B8"/>
  <text x="855" y="681" fill="#0B132B" font-size="22" font-weight="650" text-anchor="start" direction="ltr" style="text-align:left"><tspan x="855" dy="0">Recognized authorization</tspan></text>
  <circle cx="832" cy="721" r="6" fill="#00A6B8"/>
  <text x="855" y="729" fill="#0B132B" font-size="22" font-weight="650" text-anchor="start" direction="ltr" style="text-align:left"><tspan x="855" dy="0">Valid for this destination and moment</tspan></text>
  <circle cx="832" cy="769" r="6" fill="#00A6B8"/>
  <text x="855" y="777" fill="#0B132B" font-size="22" font-weight="650" text-anchor="start" direction="ltr" style="text-align:left"><tspan x="855" dy="0">Bound to the action that will execute</tspan></text>

  <path d="M1235 405H1355" fill="none" stroke="#2EA30C" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  <path d="M1235 675H1355" fill="none" stroke="#F22B1D" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow-red)"/>

  <g filter="url(#shadow)">
    <rect x="1375" y="270" width="470" height="270" rx="24" fill="#F1FAED" stroke="#2EA30C" stroke-width="3"/>
  </g>
  <circle cx="1440" cy="342" r="34" fill="none" stroke="#2EA30C" stroke-width="5"/>
  <path d="M1423 342l12 13 25-29" fill="none" stroke="#2EA30C" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1495" y="329" fill="#2EA30C" font-size="18" font-weight="850" text-anchor="start"><tspan x="1495" dy="0">RECOGNIZED AUTHORIZATION</tspan></text>
  <text x="1495" y="372" fill="#0B132B" font-size="34" font-weight="900" text-anchor="start"><tspan x="1495" dy="0">EXECUTES</tspan></text>
  <line x1="1410" y1="416" x2="1810" y2="416" stroke="#CBD5E1" stroke-width="2"/>
  
    <g transform="translate(1418 442)" fill="none" stroke="#2EA30C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 2h38l13 13v55H4z"/>
      <path d="M42 2v14h13M15 31h29M15 43h29M15 55h20"/>
    </g>
  <text x="1495" y="463" fill="#334155" font-size="20" font-weight="650" text-anchor="start"><tspan x="1495" dy="0">Destination-signed</tspan></text>
  <text x="1495" y="491" fill="#0B132B" font-size="20" font-weight="750" text-anchor="start"><tspan x="1495" dy="0">execution receipt</tspan></text>

  <g filter="url(#shadow)">
    <rect x="1375" y="570" width="470" height="270" rx="24" fill="#FFF3F1" stroke="#F22B1D" stroke-width="3"/>
  </g>
  <path d="M1415 611h50l25 25v50l-25 25h-50l-25-25v-50z" fill="none" stroke="#F22B1D" stroke-width="5"/>
  <path d="M1415 636l50 50M1465 636l-50 50" fill="none" stroke="#F22B1D" stroke-width="6" stroke-linecap="round"/>
  <text x="1515" y="629" fill="#F22B1D" font-size="18" font-weight="850" text-anchor="start"><tspan x="1515" dy="0">NO RECOGNIZED AUTHORIZATION</tspan></text>
  <text x="1515" y="672" fill="#0B132B" font-size="34" font-weight="900" text-anchor="start"><tspan x="1515" dy="0">REFUSED</tspan></text>
  <line x1="1410" y1="716" x2="1810" y2="716" stroke="#CBD5E1" stroke-width="2"/>
  
    <g transform="translate(1418 742)" fill="none" stroke="#F22B1D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 2h38l13 13v55H4z"/>
      <path d="M42 2v14h13M15 31h29M15 43h29M15 55h20"/>
    </g>
  <text x="1495" y="763" fill="#334155" font-size="20" font-weight="650" text-anchor="start"><tspan x="1495" dy="0">Destination-signed</tspan></text>
  <text x="1495" y="791" fill="#0B132B" font-size="20" font-weight="750" text-anchor="start"><tspan x="1495" dy="0">refusal receipt</tspan></text>

  <rect x="70" y="914" width="1775" height="112" rx="22" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="958" y="963" fill="#00A6B8" font-size="25" font-weight="800" text-anchor="middle"><tspan x="958" dy="0">Whatever the source. Whatever its state. The destination verifies before the protected action becomes real.</tspan></text>
  <text x="958" y="1002" fill="#334155" font-size="21" font-weight="650" text-anchor="middle"><tspan x="958" dy="0">Access, identity and capability are not authority.</tspan></text>
</svg>